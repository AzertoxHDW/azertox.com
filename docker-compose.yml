name: az-website

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  website:
    image: ${IMAGE_NAME:-svelte-app:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: az-website
    restart: unless-stopped
    init: true
    
    network_mode: "host"

    environment:
      HOST: 0.0.0.0
      PORT: ${PORT:-3000}
      
      ORIGIN: ${ORIGIN:-https://azertox.com}
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: ${XFF_DEPTH:-1}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-10M}

    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    
    stop_grace_period: 35s
    logging: *logging